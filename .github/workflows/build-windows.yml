name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Foundry-VST3-Windows
          path: build/Foundry_artefacts/Release/VST3/Foundry.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Foundry-Standalone-Windows
          path: build/Foundry_artefacts/Release/Standalone/Foundry.exe
